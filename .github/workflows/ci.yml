name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm:
    name: SwiftPM build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v

  ios:
    name: iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme CatchDev \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  ui-tests:
    name: UI tests (iOS ${{ matrix.ios }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # Run the UI / e2e suite on the OLDEST supported iOS (the example app's deployment
        # floor) and the LATEST the runner image provides. Work lands on main directly
        # (PRs are the exception here), so both legs run on every main merge.
        ios: ['16.4', 'latest']
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      # Examples/Makefile + scripts/pick-simulator.sh resolve a simulator for the requested
      # iOS — for the oldest leg that includes downloading the runtime and creating a device.
      - name: Run UI tests (iOS ${{ matrix.ios }})
        working-directory: Examples
        run: |
          if [ "${{ matrix.ios }}" = "latest" ]; then
            make test-ui
          else
            make test-ui IOS_VERSION="${{ matrix.ios }}"
          fi

  pod-lint:
    name: CocoaPods lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: pod lib lint
        run: pod lib lint --allow-warnings
