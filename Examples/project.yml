# XcodeGen spec for the example app + UI test target.
#   brew install xcodegen
#   cd Examples && xcodegen generate
# Produces CatchDevExample.xcodeproj wired to the local CatchDev package.
name: CatchDevExample

options:
  bundleIdPrefix: dev.catch.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  CatchDev:
    path: ..

targets:
  CatchDevExample:
    type: application
    platform: iOS
    sources:
      - CatchDevExample
    dependencies:
      - package: CatchDev
        product: CatchDev
    info:
      path: CatchDevExample/Info.plist
      properties:
        UILaunchScreen: {}
        # Scene life cycle: required for apps built with the iOS 27 SDK (the iOS 27 runtime
        # won't launch one without it). The window is built in SceneDelegate.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # Allow cleartext HTTP to localhost (in-process UI-test server / local backend).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.catch.example.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO

  CatchDevExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CatchDevExampleUITests
    dependencies:
      - target: CatchDevExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.catch.example.uitests
        GENERATE_INFOPLIST_FILE: YES

  # White-box unit tests for the UIKit paths that `swift test` (macOS, Foundation-only)
  # can't reach. App-hosted so UIKit is available; uses `@_spi(CatchDevTesting)` to reach
  # SDK internals (an SPM product isn't built with -enable-testing, so @testable is unreliable).
  CatchDevExampleUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CatchDevExampleUnitTests
    dependencies:
      - target: CatchDevExample
      - package: CatchDev
        product: CatchDev
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.catch.example.unittests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CatchDevExample:
    build:
      targets:
        CatchDevExample: all
        CatchDevExampleUnitTests: [test]
        CatchDevExampleUITests: [test]
    test:
      targets:
        - CatchDevExampleUnitTests
        - CatchDevExampleUITests
